name: jeremiahai
title: JeremiahAI
base: core24
version: '1.6.0'
summary: Personal AI continuity, writing, and project orchestration
description: |
  JeremiahAI is a desktop application for personal AI-assisted project
  continuity, writing workflows, task orchestration, family data tools,
  troubleshooting, and recovery-oriented workflows.

grade: stable
confinement: strict

license: Apache-2.0
website: https://j03.page/
contact: https://github.com/we6jbo/jeremiahai/issues
issues: https://github.com/we6jbo/jeremiahai/issues
source-code: https://github.com/we6jbo/jeremiahai
icon: org.oneal.jeremiahai.svg

apps:
  jeremiahai:
    command: usr/bin/jeremiahai
    desktop: usr/share/applications/org.oneal.jeremiahai.desktop
    extensions:
      - kde-neon-6

parts:
  jeremiahai:
    plugin: cmake
    source: .
    override-pull: |
      craftctl default
      sed -i -e 's|^Icon=org.oneal.jeremiahai$|Icon=/usr/share/icons/hicolor/scalable/apps/org.oneal.jeremiahai.svg|' org.oneal.jeremiahai.desktop
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
